{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Создать статью</title>
    <link rel="stylesheet" href="{% static 'css/article.css' %}">
</head>

<body>

    <div class="content">

        <h1>Создать новую статью</h1>

        <form method="POST">
            {% csrf_token %}

            <input
                type="text"
                name="title"
                placeholder="Название статьи"
                value="{{ form.title|default:'' }}"
            >

            <textarea
                name="text"
                placeholder="Текст статьи"
            >{{ form.text|default:'' }}</textarea>

            <input type="submit" value="Сохранить">
        </form>

        {% if form.errors %}
            <p class="error">{{ form.errors }}</p>
        {% endif %}

        <p>
            <a href="/">Вернуться к статьям</a>
        </p>

    </div>

</body>
</html>
