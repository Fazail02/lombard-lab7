{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Архив статей</title>
    <link rel="stylesheet" href="{% static 'css/article.css' %}">
</head>
<body>

    <div class="header">
        <img src="{% static 'img/logo.png' %}" alt="Логотип ломбарда">
        <h1>Архив статей ломбарда</h1>
    </div>

    <div class="auth-links">
    <a href="{% url 'register' %}">Регистрация</a>
    <a href="{% url 'login' %}">Войти</a>
    </div>

    <div class="archive">
        {% for post in posts %}

            <div class="one-post">
                <h2 class="post-title">
                    <a href="{% url 'get_article' post.id %}">
                        {{ post.title }}
                    </a>
                </h2>

                <button class="fold-button">свернуть</button>

                <div class="article-info">
                    <div class="article-author">
                        Автор: {{ post.author.username }}
                    </div>

                    <div class="article-created-date">
                        Дата: {{ post.created_date }}
                    </div>
                </div>

                <p class="article-text">
                    {{ post.get_excerpt }}
                </p>
            </div>

            <hr>

        {% endfor %}
    </div>

<script src="{% static 'js/helloworld.js' %}"></script>
<script src="{% static 'js/fold-post.js' %}"></script>

</body>
</html>
